{% extends "layout.html" %}

{% block title %}
Customer Registration
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-10">

        <div class="card shadow">

            <div class="card-header bg-success text-white">

                <h3 class="mb-0">

                    Customer Registration

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <!-- ============================= -->
                    <!-- Personal Information -->
                    <!-- ============================= -->

                    <h5 class="text-primary mb-3">

                        Personal Information

                    </h5>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Full Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="full_name"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                name="email"
                                required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="phone"
                                required>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                name="password"
                                required>

                        </div>

                    </div>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Gender

                            </label>

                            <select
                                class="form-select"
                                name="gender">

                                <option value="Male">

                                    Male

                                </option>

                                <option value="Female">

                                    Female

                                </option>

                                <option value="Other">

                                    Other

                                </option>

                            </select>

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Date of Birth

                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="dob">

                        </div>

                    </div>

                    <!-- ============================= -->

                    <hr>

                    <h5 class="text-primary mb-3">

                        Address Information

                    </h5>

                    <div class="mb-3">

                        <label class="form-label">

                            Address

                        </label>

                        <textarea
                            class="form-control"
                            rows="3"
                            name="address"></textarea>

                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">

                            <label class="form-label">

                                City

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="city">

                        </div>

                        <div class="col-md-4 mb-3">

                            <label class="form-label">

                                State

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="state">

                        </div>

                        <div class="col-md-4 mb-3">

                            <label class="form-label">

                                Pincode

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="pincode">

                        </div>

                    </div>

                    <!-- ============================= -->

                    <hr>

                    <h5 class="text-primary mb-3">

                        Identity Information

                    </h5>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Aadhaar Number

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="aadhaar_number">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                PAN Number

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="pan_number">

                        </div>

                    </div>

                    <!-- ============================= -->

                    <hr>

                    <h5 class="text-primary mb-3">

                        Employment Information

                    </h5>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Occupation

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="occupation">

                        </div>

                        <div class="col-md-6 mb-3">

                            <label class="form-label">

                                Monthly Income

                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="monthly_income">

                        </div>

                    </div>

                    <!-- ============================= -->

                    <div class="text-center mt-4">

                        <button
                            class="btn btn-success btn-lg">

                            Register

                        </button>

                        <a
                            href="{{ url_for('auth.login') }}"
                            class="btn btn-secondary btn-lg">

                            Login

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
