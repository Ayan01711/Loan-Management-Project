{% extends "layout.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-5">

        <div class="card shadow-lg">

            <div class="card-header bg-primary text-white text-center">

                <h3>

                    Login

                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <!-- Login Type -->

                    <div class="mb-3">

                        <label class="form-label">

                            Login As

                        </label>

                        <select
                            class="form-select"
                            id="login_type"
                            name="login_type"
                            onchange="changeLoginType()"
                            required>

                            <option value="customer">

                                Customer

                            </option>

                            <option value="admin">

                                Administrator

                            </option>

                        </select>

                    </div>

                    <!-- Customer Email -->

                    <div
                        class="mb-3"
                        id="email_div">

                        <label class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            class="form-control"
                            name="email"
                            placeholder="Enter Email">

                    </div>

                    <!-- Admin Username -->

                    <div
                        class="mb-3"
                        id="username_div"
                        style="display:none;">

                        <label class="form-label">

                            Username

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="username"
                            placeholder="Enter Username">

                    </div>

                    <!-- Password -->

                    <div class="mb-3">

                        <label class="form-label">

                            Password

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            required>

                    </div>

                    <button
                        class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

            </div>

            <div class="card-footer text-center">

                Don't have an account?

                <a href="{{ url_for('auth.register') }}">

                    Register

                </a>

            </div>

        </div>

    </div>

</div>

<script>

function changeLoginType(){

    let type=document.getElementById("login_type").value;

    if(type==="customer"){

        document.getElementById("email_div").style.display="block";

        document.getElementById("username_div").style.display="none";

    }

    else{

        document.getElementById("email_div").style.display="none";

        document.getElementById("username_div").style.display="block";

    }

}

</script>

{% endblock %}
